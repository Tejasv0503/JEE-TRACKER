<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JEE Apex — Study Command Center &amp; Animated To-Do Workspace</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            void: '#05070e',
            obsidian: '#0b101e',
            panel: '#11182c',
            accent: {
              cyan: '#22d3ee',
              indigo: '#818cf8',
              violet: '#a78bfa',
              emerald: '#34d399',
              amber: '#fbbf24',
              rose: '#fb7185',
            }
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --bg-void: #05070e;
      --bg-panel: rgba(17, 24, 44, 0.72);
      --border-subtle: rgba(148, 163, 184, 0.14);
      --glow-cyan: rgba(34, 211, 238, 0.25);
      --glow-indigo: rgba(129, 140, 248, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-void);
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08), transparent 38%),
        radial-gradient(circle at 85% 20%, rgba(139, 92, 246, 0.10), transparent 40%),
        radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.07), transparent 45%),
        #05070e;
    }

    /* Animated Ambient Aurora Blobs */
    .aurora-orb {
      position: fixed;
      border-radius: 9999px;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }
    .aurora-1 {
      width: 420px; height: 420px;
      top: -100px; left: -80px;
      background: radial-gradient(circle, rgba(34, 211, 238, 0.35), transparent 70%);
    }
    .aurora-2 {
      width: 480px; height: 480px;
      top: 25%; right: -140px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.32), transparent 70%);
      animation-delay: -6s;
      animation-duration: 22s;
    }
    .aurora-3 {
      width: 380px; height: 380px;
      bottom: -100px; left: 30%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.25), transparent 70%);
      animation-delay: -11s;
      animation-duration: 25s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(35px, -25px) scale(1.08); }
      100% { transform: translate(-25px, 30px) scale(0.95); }
    }

    /* Particle Canvas */
    #particleCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
      transition: opacity 0.4s ease;
    }
    #particleCanvas.hidden-bg {
      opacity: 0;
    }

    /* Glass Card & Animated Gradient Border */
    .glass-card {
      position: relative;
      background: linear-gradient(145deg, rgba(17, 24, 44, 0.84), rgba(10, 14, 28, 0.90));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 1.15rem;
      box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.65);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.32s ease, box-shadow 0.32s ease;
    }

    .glass-card:hover {
      border-color: rgba(56, 189, 248, 0.28);
      box-shadow: 0 20px 48px -14px rgba(0, 0, 0, 0.78), 0 0 28px -8px rgba(34, 211, 238, 0.14);
    }

    .card-lift:hover {
      transform: translateY(-3px);
    }

    /* Animated Shimmer Accent Line */
    .shimmer-line {
      position: relative;
      overflow: hidden;
    }
    .shimmer-line::after {
      content: '';
      position: absolute;
      top: 0; left: -120%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      animation: shimmerSweep 4.5s infinite;
    }
    @keyframes shimmerSweep {
      0% { left: -120%; }
      45%, 100% { left: 160%; }
    }

    /* Navigation Dropdown Submenu Animations */
    .nav-item {
      position: relative;
    }
    .submenu-panel {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      min-width: 245px;
      background: rgba(11, 16, 30, 0.96);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 1rem;
      padding: 0.5rem;
      box-shadow: 0 24px 50px -12px rgba(0, 0, 0, 0.85), 0 0 24px -6px rgba(34, 211, 238, 0.2);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px) scale(0.96);
      transform-origin: top left;
      transition: opacity 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                  visibility 0.22s;
      z-index: 60;
    }
    .nav-item.open > .submenu-panel,
    .nav-item:hover > .submenu-panel {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }
    .submenu-panel::before {
      content: '';
      position: absolute;
      top: -12px;
      left: 0;
      right: 0;
      height: 12px;
    }

    /* Mobile Accordion Submenu */
    .mobile-submenu {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
      opacity: 0;
    }
    .mobile-nav-group.open .mobile-submenu {
      max-height: 360px;
      opacity: 1;
    }
    .mobile-nav-group.open .chevron-icon {
      transform: rotate(180deg);
    }

    /* View / Section Entrance Animations */
    .view-section {
      display: none;
      opacity: 0;
      transform: translateY(14px);
    }
    .view-section.active {
      display: block;
      animation: viewFadeIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes viewFadeIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Staggered Task Item Animation */
    .task-row {
      animation: taskSlideIn 0.34s cubic-bezier(0.22, 1, 0.36, 1) backwards;
      transition: transform 0.22s ease, background-color 0.22s ease, border-color 0.22s ease, opacity 0.25s ease;
    }
    .task-row:hover {
      transform: translateX(4px);
      background-color: rgba(30, 41, 59, 0.65);
    }
    .task-row.removing {
      opacity: 0;
      transform: translateX(28px) scale(0.96);
    }
    @keyframes taskSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Custom Animated Checkbox */
    .check-orb {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid rgba(148, 163, 184, 0.4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
    }
    .check-orb:hover {
      border-color: #22d3ee;
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.35);
      transform: scale(1.08);
    }
    .check-orb.checked {
      background: linear-gradient(135deg, #06b6d4, #10b981);
      border-color: transparent;
      transform: scale(1.05);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.45);
    }

    /* Formula Card 3D Flip */
    .flip-perspective {
      perspective: 1100px;
    }
    .flip-inner {
      position: relative;
      width: 100%;
      min-height: 215px;
      transform-style: preserve-3d;
      transition: transform 0.62s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .flip-card.flipped .flip-inner {
      transform: rotateY(180deg);
    }
    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flip-back {
      transform: rotateY(180deg);
    }

    /* Pulse Ring */
    .pulse-dot {
      position: relative;
    }
    .pulse-dot::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 9999px;
      background: inherit;
      opacity: 0.55;
      animation: pulseRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(1.75); opacity: 0; }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #070a14;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(34, 211, 238, 0.45);
    }

    /* Toast Notification */
    .toast-enter {
      animation: toastIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(18px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
